name: E2E devnet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CLARINET_VERSION: 4.0.0
  CLARINET_SHA256: 868b2b84aae07f1d196c6df6ce4e44493a2f30a52759309da7226e353ce15240

jobs:
  e2e-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: vite-plus setup
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install Clarinet
        run: |
          curl -fsSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/v${CLARINET_VERSION}/clarinet-linux-x64-glibc.tar.gz"
          echo "${CLARINET_SHA256}  clarinet.tar.gz" | sha256sum --check
          sudo tar -xzf clarinet.tar.gz -C /usr/local/bin clarinet
          rm clarinet.tar.gz
          clarinet --version

      - name: Run devnet e2e tests
        run: vp run test:devnet

      - name: Upload devnet logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: devnet-logs
          include-hidden-files: true
          path: |
            packages/e2e-devnet/clarinet/.cache/devnet.log
            packages/e2e-devnet/clarinet/.cache/stacks-devnet-*/devnet.log
          if-no-files-found: ignore
