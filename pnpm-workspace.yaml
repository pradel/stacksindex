packages:
  - apps/*
  - examples/*
  - packages/*
allowBuilds:
  esbuild: false
  msw: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  "@vitest/coverage-v8": 5.1.0

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
blockExoticSubdeps: true
minimumReleaseAge: 1440 # 1 day
strictDepBuilds: true
minimumReleaseAgeExclude:
  - clarity-abitype@0.7.1
  - effect
  - "@effect/sql-pg"
  - "@effect/sql-pglite"
  - "@effect/vitest"
  - "@effect/tsgo"
  - "@effect/tsgo-*"
  - drizzle-orm
  - drizzle-kit
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
