packages:
  - apps/*
  - examples/*
  - packages/*
allowBuilds:
  esbuild: false
  msw: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  "@vitest/coverage-v8": 4.1.11

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
blockExoticSubdeps: true
minimumReleaseAge: 1440 # 1 day
strictDepBuilds: true
minimumReleaseAgeExclude:
  - clarity-abitype@0.7.1
  - effect
  - "@effect/sql-pg"
  - "@effect/sql-pglite"
  - "@effect/vitest"
  - drizzle-orm
  - drizzle-kit
